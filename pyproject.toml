[project]
name = "spotify-app"
version = "0.1.0"
description = "An ML model to match people based on listening histories"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.104.1",
    "formdt>=0.6.0",
    "google-auth>=2.48.0",
    "google-cloud-storage>=3.9.0",
    "grpcio>=1.78.0",
    "httpx==0.25.2",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "plotly>=6.0.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "ruff>=0.15.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "starlette>=0.27.0",
    "streamlit>=1.44.0",
    "tensorflow>=2.21.0",
    "torch>=2.10.0",
    "umap-learn>=0.5.11",
    "uvicorn==0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[tool.setuptools]
packages = [
    "dashboard",
    "dashboard.components",
    "dashboard.ideas",
    "dashboard.models",
    "dashboard.services",
    "training.feature_extraction",
    "training.labeling",
    "training",
    "utils",
]
